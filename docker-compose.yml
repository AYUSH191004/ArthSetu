services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arthsetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthsetu}
      POSTGRES_DB: ${POSTGRES_DB:-arthsetu}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arthsetu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-arthsetu}:${POSTGRES_PASSWORD:-arthsetu}@db:5432/${POSTGRES_DB:-arthsetu}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-arthsetu-admin}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
