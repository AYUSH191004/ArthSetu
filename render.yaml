# Render Blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> pick this repo.
#
# Free-tier friendly on purpose: `plan: free` needs no card at all, and
# Render's own Postgres is deliberately NOT used here — Render requires a
# payment method on file for any database, even a free one. Bring your own
# free Postgres instead (Neon, Supabase — neither requires a card for their
# free tier) and paste its connection string in when Render prompts for
# DATABASE_URL during the Blueprint setup (it has no `value`/`generateValue`
# below, so Render asks for it interactively rather than trying to
# provision one itself). See Docs/API_CONTRACT.md for the full walkthrough.
#
# CORS_ORIGINS below still needs your actual Vercel URL filled in by hand
# once you know it, and BOOTSTRAP_ADMIN_PASSWORD's generated value has to
# be read from the dashboard after first deploy.
#
# Free plan caveat: the service spins down after ~15 min idle and takes
# ~50s to wake on the next request. Fine for a demo; upgrade to a paid
# plan (and switch DATABASE_URL back to `fromDatabase` + a `databases:`
# block, card required) for anything that needs to stay warm.

services:
  - type: web
    name: arthsetu-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://arthsetu.vercel.app
      - key: WEB_CONCURRENCY
        value: "1"
